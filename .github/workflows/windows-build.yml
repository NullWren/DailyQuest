name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        shell: pwsh
        run: ./build.ps1

      - name: Test checklist and storage rules
        shell: pwsh
        run: ./test.ps1

      - name: Test quest imports
        shell: pwsh
        run: ./test-import.ps1

      - name: Test WPF editor and weekly tab
        shell: pwsh
        run: ./test-editor.ps1

      - name: Test optional themes and settings
        shell: pwsh
        run: ./test-themes.ps1

      - name: Test leaderboard tally and local invite storage
        shell: pwsh
        run: ./test-leaderboard.ps1

      - name: Test leaderboard receiver
        shell: pwsh
        run: node --test leaderboard/worker/test.mjs

      - name: Package shareable app
        shell: pwsh
        run: ./package.ps1

      - name: Save Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WrenFeed-Windows
          path: release/WrenFeed.zip
          if-no-files-found: error

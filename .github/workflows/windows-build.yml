name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        shell: pwsh
        run: ./build.ps1

      - name: Test checklist and storage rules
        shell: pwsh
        run: ./test.ps1

      - name: Test WPF editor and weekly tab
        shell: pwsh
        run: ./test-editor.ps1

      - name: Package shareable app
        shell: pwsh
        run: ./package.ps1

      - name: Save Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DailyQuest-Windows
          path: release/DailyQuest.zip
          if-no-files-found: error
